\* SP may drop chunks: proofs stay sound, period closes
SPECIFICATION Spec
CONSTANTS
  Chunks = {c1, c2}
  Ranges = {r1, r2}
  HeldRanges = {r1, r2}
  Nonces = {n1, n2, n3}
  HeldInit = {c1, c2}
  Other = {}
  RelayLat = 2
  Budget = 1
  MaxLat = 1
  AllowDrop = TRUE
  PartLen = 0
  MaxTime = 10
  W = 4
  Thr = 70
  MinProbes = 2
  None = None
INVARIANTS TypeOK NoFalseProof ProofSound
PROPERTY Resolved Closes
