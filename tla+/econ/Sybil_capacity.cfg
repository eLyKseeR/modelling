\* two operators (A = i1+i2, i3) cannot hold 3 chunks x 2 replicas with MaxShare = 2: the file is never fully placed
SPECIFICATION Spec
CONSTANTS
  Chunks = {c1, c2, c3}
  Ids = {i1, i2, i3}
  Sybils = {i1, i2}
  R = 2
  MaxShare = 2
  Attested = TRUE
  ReplicaBound = FALSE
INVARIANTS TypeOK NeverAllPlaced
CHECK_DEADLOCK FALSE
